<h2>桌面应用 UI 布局方案</h2>
<p class="subtitle">Flask + 本地网页，以下两种布局风格，哪种更顺手？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>单页流程式</h3>
      <p>所有操作在一页内完成：上传 → 设置 → 开始 → 进度 → 下载。类似一个表单从头走到尾，简单直接</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>步骤引导式</h3>
      <p>分步骤引导：第1步「选择视频」→ 第2步「设置参数」→ 第3步「处理中」→ 第4步「下载」。每步一个界面，新手友好</p>
    </div>
  </div>
</div>
